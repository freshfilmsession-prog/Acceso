<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yusen Logistics · Registro de acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#0A1F44;--navy2:#13346F;--orange:#F47B20;--white:#fff;--soft:#EEF2F8;--line:#D5DDEA;--ok:#1F9D63}
*{box-sizing:border-box;margin:0}
body{font-family:Archivo,system-ui,sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:4px solid var(--orange)}
.logo{font-weight:900;font-size:26px;letter-spacing:.5px}.logo b{color:var(--orange)}.logo small{display:block;font-weight:600;font-size:11px;letter-spacing:3px;opacity:.7}
.clock{text-align:right;font-weight:600;font-size:14px;opacity:.9}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:22px}
.view{display:none;width:100%;max-width:760px}.view.on{display:block}
h1{font-size:clamp(28px,6vw,46px);font-weight:900;line-height:1.05;margin-bottom:8px}
.sub{opacity:.75;margin-bottom:26px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.big{border:0;border-radius:16px;padding:30px 18px;font:800 20px Archivo;cursor:pointer;color:var(--navy);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s}
.big:hover{transform:translateY(-3px)}.big svg{width:54px;height:54px}.big.or{background:var(--orange);color:var(--white)}
.big small{font-weight:600;font-size:13px;opacity:.75}
.card{background:var(--white);color:var(--navy);border-radius:18px;padding:26px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:10px;font:600 16px Archivo;color:var(--navy);background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{border:0;background:none;padding:12px;border-radius:9px;font:800 15px Archivo;color:var(--navy);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}.seg button.on.out{background:var(--orange)}
.btn{width:100%;margin-top:20px;border:0;border-radius:12px;padding:17px;font:800 18px Archivo;background:var(--orange);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:inherit;font:600 14px Archivo;opacity:.8;cursor:pointer;margin-top:16px;text-decoration:underline}
.dt{display:inline-block;background:var(--soft);padding:8px 14px;border-radius:30px;font-weight:600;font-size:14px;margin-bottom:6px}
.err{color:#C62828;font-weight:600;margin-top:12px;min-height:20px}
.done{text-align:center;background:var(--white);color:var(--navy);border-radius:18px;padding:40px 26px}
.done .tick{width:84px;height:84px;border-radius:50%;background:var(--ok);margin:0 auto 18px;display:grid;place-items:center}
.done .tick svg{width:46px;height:46px}.done p{font-size:19px;line-height:1.45;max-width:520px;margin:0 auto 10px}
.done.out .tick{background:var(--orange)}
.langs button{font-size:18px}
footer{padding:12px;text-align:center;font-size:12px;opacity:.6}
footer button{color:#fff}
/* staff */
#v-staff{max-width:1100px;color:var(--navy)}
.panel{background:var(--soft);border-radius:18px;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border-radius:14px;padding:16px;border-left:6px solid var(--navy)}.kpi.o{border-color:var(--orange)}.kpi.g{border-color:var(--ok)}
.kpi b{font-size:36px;font-weight:900;display:block}.kpi span{font-size:13px;font-weight:600;opacity:.7}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:6px 0 14px}.filters div{flex:1;min-width:130px}.filters label{margin:0 0 4px}
.filters button{padding:14px 16px;border:0;border-radius:10px;font:800 14px Archivo;background:var(--navy);color:#fff;cursor:pointer}
.tw{overflow-x:auto;background:#fff;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--navy);color:#fff;text-align:left;padding:11px;font-weight:600;white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800}.t-v{background:#FFE6D2;color:#B34E00}.t-w{background:#DCE6F8;color:var(--navy2)}
.in{color:var(--ok);font-weight:800}.h2{font-size:20px;font-weight:900;margin:18px 0 10px}
#qrbox{background:#fff;display:inline-block;padding:14px;border-radius:12px}
.pin{max-width:320px;margin:auto;text-align:center}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media print{body{background:#fff}header,footer,.filters,.noprint{display:none!important}#v-staff{color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">YUSEN <b>Logistics</b><small>BARCELONA</small></div>
  <div class="clock" id="clock"></div>
</header>
<main>
  <!-- Idioma -->
  <section class="view on" id="v-lang">
    <h1>Bienvenido · Benvingut · Welcome · Bienvenue</h1>
    <p class="sub">Idioma · Idioma · Language · Langue</p>
    <div class="grid langs">
      <button class="big" data-l="es">Español</button>
      <button class="big" data-l="ca">Català</button>
      <button class="big or" data-l="en">English</button>
      <button class="big or" data-l="fr">Français</button>
    </div>
  </section>
  <!-- Tipo -->
  <section class="view" id="v-type">
    <h1 data-t="pick"></h1><p class="sub" data-t="pickSub"></p>
    <div class="grid">
      <button class="big or" data-type="visita">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span data-t="visits"></span><small data-t="visitsSub"></small></button>
      <button class="big" data-type="trabajador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15a8 8 0 0 1 16 0z"/><path d="M2 18h20M12 5v3"/></svg>
        <span data-t="workers"></span><small data-t="workersSub"></small></button>
    </div>
    <button class="link" id="b-lang" data-t="changeLang"></button>
  </section>
  <!-- Formulario -->
  <section class="view" id="v-form">
    <div class="card">
      <span class="dt" id="dt"></span>
      <h1 id="f-title" style="font-size:30px"></h1>
      <div class="seg"><button id="m-in" class="on" data-t="entry"></button><button id="m-out" class="out" data-t="exit"></button></div>
      <label for="f-name" data-t="name"></label><input id="f-name" autocomplete="off">
      <label for="f-co" data-t="company"></label><input id="f-co" autocomplete="off">
      <div id="reason-wrap"><label for="f-re" data-t="reason"></label><input id="f-re" autocomplete="off"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go"></button>
      <button class="link" id="b-back" style="color:var(--navy)" data-t="back"></button>
    </div>
  </section>
  <!-- Confirmación -->
  <section class="view" id="v-done">
    <div class="done" id="done"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      <h1 id="d-title" style="font-size:32px"></h1><p id="d-msg"></p>
      <button class="btn" id="d-new" data-t="newReg" style="max-width:320px"></button></div>
  </section>
  <!-- Staff -->
  <section class="view" id="v-staff"></section>
</main>
<footer>Yusen Logistics Barcelona · <button class="link" id="b-staff" style="margin:0">Staff</button></footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,doc,getDocs,query,where,onSnapshot,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== CONFIGURACIÓN ====== */
const firebaseConfig={apiKey:"AIzaSyAcK6twef3fljQXy-TC5iaQTRBhhHV45QA",authDomain:"yusen-accesos.firebaseapp.com",projectId:"yusen-accesos",appId:"1:569296695889:web:c03376482faa5faeb57e70"};
const STAFF_PIN="2468";            // cambia este PIN
const COLECCION="registros";
/* =========================== */

const db=getFirestore(initializeApp(firebaseConfig)),col=collection(db,COLECCION);
const L={
es:{loc:"es-ES",pick:"¿Cuál es el motivo de tu visita?",pickSub:"Selecciona una opción para registrarte.",visits:"Visitas",visitsSub:"Visitante o cliente",workers:"Trabajadores",workersSub:"Personal externo / ETT",changeLang:"Cambiar idioma",entry:"Entrada",exit:"Salida",name:"Nombre y apellidos",company:"Empresa",reason:"Motivo de la visita",back:"Volver",
 tV:"Registro de visita",tW:"Fichaje de trabajador",goIn:"Registrar llegada",goInW:"Registrar entrada",goOut:"Registrar salida",fill:"Completa todos los campos.",noOpen:"No encontramos una entrada abierta con estos datos. Revisa nombre y empresa.",already:"Ya tienes una entrada registrada. Registra primero tu salida.",fail:"No se pudo guardar. Inténtalo de nuevo.",newReg:"Nuevo registro",
 dV:"Llegada registrada",mV:"Bienvenido a Yusen Logistics. Por favor, espere en recepción. Un miembro del personal le entregará chaleco, calzado y una acreditación para acceder.",dW:"Entrada registrada",mW:"Entrada registrada. Que tenga una buena jornada.",dO:"Salida registrada",mO:"Salida registrada. Gracias y hasta pronto."},
ca:{loc:"ca-ES",pick:"Quin és el motiu de la teva visita?",pickSub:"Selecciona una opció per registrar-te.",visits:"Visites",visitsSub:"Visitant o client",workers:"Treballadors",workersSub:"Personal extern / ETT",changeLang:"Canviar idioma",entry:"Entrada",exit:"Sortida",name:"Nom i cognoms",company:"Empresa",reason:"Motiu de la visita",back:"Tornar",
 tV:"Registre de visita",tW:"Fitxatge de treballador",goIn:"Registrar arribada",goInW:"Registrar entrada",goOut:"Registrar sortida",fill:"Completa tots els camps.",noOpen:"No trobem cap entrada oberta amb aquestes dades. Revisa nom i empresa.",already:"Ja tens una entrada registrada. Registra primer la sortida.",fail:"No s'ha pogut desar. Torna-ho a provar.",newReg:"Nou registre",
 dV:"Arribada registrada",mV:"Benvingut a Yusen Logistics. Si us plau, esperi a recepció. Un membre del personal li lliurarà armilla, calçat i una acreditació per accedir.",dW:"Entrada registrada",mW:"Entrada registrada. Que tingui una bona jornada.",dO:"Sortida registrada",mO:"Sortida registrada. Gràcies i fins aviat."},
en:{loc:"en-GB",pick:"What brings you here?",pickSub:"Select an option to sign in.",visits:"Visitors",visitsSub:"Visitor or client",workers:"Workers",workersSub:"External staff / agency",changeLang:"Change language",entry:"Sign in",exit:"Sign out",name:"Full name",company:"Company",reason:"Reason for visit",back:"Back",
 tV:"Visitor registration",tW:"Worker clock-in",goIn:"Register arrival",goInW:"Register entry",goOut:"Register exit",fill:"Please fill in all fields.",noOpen:"We couldn't find an open entry with these details. Check name and company.",already:"You already have an open entry. Please sign out first.",fail:"Could not save. Please try again.",newReg:"New registration",
 dV:"Arrival registered",mV:"Welcome to Yusen Logistics. Please wait at reception. A member of staff will give you a safety vest, safety footwear and an access badge.",dW:"Entry registered",mW:"Entry registered. Have a good shift.",dO:"Exit registered",mO:"Exit registered. Thank you and see you soon."},
fr:{loc:"fr-FR",pick:"Quel est le motif de votre venue ?",pickSub:"Sélectionnez une option pour vous enregistrer.",visits:"Visiteurs",visitsSub:"Visiteur ou client",workers:"Travailleurs",workersSub:"Personnel externe / intérim",changeLang:"Changer de langue",entry:"Entrée",exit:"Sortie",name:"Nom et prénom",company:"Entreprise",reason:"Motif de la visite",back:"Retour",
 tV:"Enregistrement visiteur",tW:"Pointage travailleur",goIn:"Enregistrer l'arrivée",goInW:"Enregistrer l'entrée",goOut:"Enregistrer la sortie",fill:"Veuillez remplir tous les champs.",noOpen:"Aucune entrée ouverte trouvée avec ces données. Vérifiez le nom et l'entreprise.",already:"Vous avez déjà une entrée enregistrée. Enregistrez d'abord votre sortie.",fail:"Échec de l'enregistrement. Réessayez.",newReg:"Nouvel enregistrement",
 dV:"Arrivée enregistrée",mV:"Bienvenue chez Yusen Logistics. Veuillez patienter à l'accueil. Un membre du personnel vous remettra un gilet, des chaussures de sécurité et un badge d'accès.",dW:"Entrée enregistrée",mW:"Entrée enregistrée. Bonne journée de travail.",dO:"Sortie enregistrée",mO:"Sortie enregistrée. Merci et à bientôt."}
};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let lang="es",tipo="visita",mode="in",timer,unsubs=[];
const t=k=>L[lang][k];

function show(id){$$(".view").forEach(v=>v.classList.toggle("on",v.id===id));clearTimeout(timer)}
function applyLang(){document.documentElement.lang=lang;$$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));updForm()}
function tick(){const n=new Date(),o={weekday:"long",day:"numeric",month:"long",year:"numeric"};
 const txt=n.toLocaleDateString(L[lang].loc,o)+" · "+n.toLocaleTimeString(L[lang].loc,{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 $("#clock").textContent=txt;$("#dt").textContent=txt}
setInterval(tick,1000);tick();

function updForm(){
 $("#f-title").textContent=tipo==="visita"?t("tV"):t("tW");
 $("#m-in").classList.toggle("on",mode==="in");$("#m-out").classList.toggle("on",mode==="out");
 $("#reason-wrap").style.display=(tipo==="visita"&&mode==="in")?"block":"none";
 $("#go").textContent=mode==="out"?t("goOut"):(tipo==="visita"?t("goIn"):t("goInW"));
 $("#err").textContent="";
}
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L[lang].loc;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

$$("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();show("v-type")});
$$("[data-type]").forEach(b=>b.onclick=()=>{tipo=b.dataset.type;mode="in";$("#f-name").value=$("#f-co").value=$("#f-re").value="";updForm();show("v-form")});
$("#b-lang").onclick=()=>show("v-lang");$("#b-back").onclick=()=>show("v-type");
$("#m-in").onclick=()=>{mode="in";updForm()};$("#m-out").onclick=()=>{mode="out";updForm()};
$("#d-new").onclick=reset;
function reset(){speechSynthesis?.cancel();show("v-lang")}

$("#go").onclick=async()=>{
 const n=$("#f-name").value.trim(),c=$("#f-co").value.trim(),r=$("#f-re").value.trim(),err=$("#err"),btn=$("#go");
 if(!n||!c||(mode==="in"&&tipo==="visita"&&!r)){err.textContent=t("fill");return}
 btn.disabled=true;err.textContent="";
 const key=[tipo,norm(n),norm(c)].join("|"),now=new Date();
 try{
  const open=await getDocs(query(col,where("key","==",key),where("abierto","==",true)));
  if(mode==="in"){
   if(!open.empty){err.textContent=t("already");btn.disabled=false;return}
   await addDoc(col,{tipo,nombre:n,empresa:c,motivo:tipo==="visita"?r:"",key,fecha:ymd(now),entrada:Timestamp.fromDate(now),salida:null,abierto:true,idioma:lang});
  }else{
   if(open.empty){err.textContent=t("noOpen");btn.disabled=false;return}
   await Promise.all(open.docs.map(d=>updateDoc(doc(db,COLECCION,d.id),{salida:Timestamp.fromDate(now),abierto:false})));
  }
  const msg=mode==="out"?t("mO"):tipo==="visita"?t("mV"):t("mW");
  $("#d-title").textContent=mode==="out"?t("dO"):tipo==="visita"?t("dV"):t("dW");
  $("#d-msg").textContent=msg;$("#done").classList.toggle("out",mode==="out");
  show("v-done");speak(msg);timer=setTimeout(reset,25000);
 }catch(e){console.error(e);err.textContent=t("fail")}
 btn.disabled=false;
};

/* ====== PANEL STAFF ====== */
$("#b-staff").onclick=()=>{
 show("v-staff");
 $("#v-staff").innerHTML=`<div class="card pin"><h1 style="font-size:26px">Staff</h1><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric"><div class="err" id="pe"></div><button class="btn" id="pgo">Acceder</button><button class="link" id="pback" style="color:var(--navy)">Volver</button></div>`;
 $("#pback").onclick=reset;
 $("#pgo").onclick=()=>$("#pin").value===STAFF_PIN?staff():($("#pe").textContent="PIN incorrecto");
};
function staff(){
 const today=ymd(new Date());
 $("#v-staff").innerHTML=`<div class="panel">
 <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1 style="font-size:28px">Panel de accesos</h1><button class="link noprint" id="sx" style="color:var(--navy)">Cerrar sesión</button></div>
 <div class="kpis"><div class="kpi g"><b id="k1">0</b><span>Dentro ahora</span></div><div class="kpi o"><b id="k2">0</b><span>Visitas dentro</span></div><div class="kpi"><b id="k3">0</b><span>Trabajadores dentro</span></div><div class="kpi"><b id="k4">0</b><span>Salidas en el periodo</span></div></div>
 <div class="h2">Dentro ahora</div><div class="tw"><table><thead><tr><th>Tipo</th><th>Nombre</th><th>Empresa</th><th>Motivo</th><th>Entrada</th></tr></thead><tbody id="tb-in"></tbody></table></div>
 <div class="h2">Informe</div>
 <div class="filters"><div><label>Desde</label><input type="date" id="f1" value="${today}"></div><div><label>Hasta</label><input type="date" id="f2" value="${today}"></div>
 <div><label>Tipo</label><select id="ft"><option value="">Todos</option><option value="visita">Visitas</option><option value="trabajador">Trabajadores</option></select></div>
 <div><label>Estado</label><select id="fs"><option value="">Todos</option><option value="in">Dentro</option><option value="out">Han salido</option></select></div>
 <button id="csv">Exportar CSV</button><button id="prt" style="background:var(--orange)">Imprimir</button></div>
 <div class="tw"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Nombre</th><th>Empresa</th><th>Motivo</th><th>Entrada</th><th>Salida</th><th>Duración</th></tr></thead><tbody id="tb-rep"></tbody></table></div>
 <div class="h2 noprint">QR de acceso</div><div class="noprint"><div id="qrbox"></div><p style="margin-top:8px;font-size:13px">Imprime este QR y colócalo en la entrada. Apunta a: <b id="qrurl"></b></p></div></div>`;
 $("#sx").onclick=()=>{unsubs.forEach(u=>u());unsubs=[];reset()};
 const url=location.href.split("#")[0].split("?")[0];$("#qrurl").textContent=url;new QRCode($("#qrbox"),{text:url,width:200,height:200,colorDark:"#0A1F44"});
 let inside=[],rows=[],unRep=null;
 const hm=ts=>ts?ts.toDate().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—";
 const dd=ts=>ts?ts.toDate().toLocaleDateString("es-ES"):"";
 const tag=x=>x==="visita"?'<span class="tag t-v">Visita</span>':'<span class="tag t-w">Trabajador</span>';
 const dur=r=>{if(!r.salida)return"";const m=Math.round((r.salida.toMillis()-r.entrada.toMillis())/60000);return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"};
 function drawIn(){
  const a=[...inside].sort((x,y)=>x.entrada.toMillis()-y.entrada.toMillis());
  $("#k1").textContent=a.length;$("#k2").textContent=a.filter(r=>r.tipo==="visita").length;$("#k3").textContent=a.filter(r=>r.tipo==="trabajador").length;
  $("#tb-in").innerHTML=a.map(r=>`<tr><td>${tag(r.tipo)}</td><td>${esc(r.nombre)}</td><td>${esc(r.empresa)}</td><td>${esc(r.motivo)}</td><td>${dd(r.entrada)} ${hm(r.entrada)}</td></tr>`).join("")||'<tr><td colspan="5">Nadie dentro ahora.</td></tr>';
 }
 function drawRep(){
  const ft=$("#ft").value,fs=$("#fs").value;
  const a=rows.filter(r=>(!ft||r.tipo===ft)&&(!fs||(fs==="in")===r.abierto)).sort((x,y)=>y.entrada.toMillis()-x.entrada.toMillis());
  $("#k4").textContent=a.filter(r=>!r.abierto).length;
  $("#tb-rep").innerHTML=a.map(r=>`<tr><td>${esc(r.fecha)}</td><td>${tag(r.tipo)}</td><td>${esc(r.nombre)}</td><td>${esc(r.empresa)}</td><td>${esc(r.motivo)}</td><td>${hm(r.entrada)}</td><td>${r.abierto?'<span class="in">Dentro</span>':hm(r.salida)}</td><td>${dur(r)}</td></tr>`).join("")||'<tr><td colspan="8">Sin registros para este filtro.</td></tr>';
  drawRep.cur=a;
 }
 function sub(){
  unRep?.();const f1=$("#f1").value,f2=$("#f2").value;
  unRep=onSnapshot(query(col,where("fecha",">=",f1),where("fecha","<=",f2)),s=>{rows=s.docs.map(d=>d.data());drawRep()});
 }
 unsubs.push(onSnapshot(query(col,where("abierto","==",true)),s=>{inside=s.docs.map(d=>d.data());drawIn()}),()=>unRep?.());
 sub();
