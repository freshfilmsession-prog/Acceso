<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yusen Logistics · Registro de acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#0A1F44;--navy2:#13346F;--orange:#F47B20;--white:#fff;--soft:#EEF2F8;--line:#D5DDEA;--ok:#1F9D63;--f:Archivo,"Noto Sans Arabic",system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f);background:var(--navy);color:var(--white);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:4px solid var(--orange)}
.logo{font-weight:900;font-size:26px;letter-spacing:.5px}.logo b{color:var(--orange)}.logo small{display:block;font-weight:600;font-size:11px;letter-spacing:3px;opacity:.7}
.clock{text-align:right;font-weight:600;font-size:14px;opacity:.9}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:22px}
.view{display:none;width:100%;max-width:760px}.view.on{display:block}
h1{font-size:clamp(28px,6vw,46px);font-weight:900;line-height:1.05;margin-bottom:8px}
.sub{opacity:.75;margin-bottom:26px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.big{border:0;border-radius:16px;padding:30px 18px;font:800 20px var(--f);cursor:pointer;color:var(--navy);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s}
.big:hover{transform:translateY(-3px)}.big svg{width:54px;height:54px}.big.or{background:var(--orange);color:var(--white)}
.big small{font-weight:600;font-size:13px;opacity:.75}
.card{background:var(--white);color:var(--navy);border-radius:18px;padding:26px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:10px;font:600 16px var(--f);color:var(--navy);background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{border:0;background:none;padding:12px;border-radius:9px;font:800 15px var(--f);color:var(--navy);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}.seg button.on.out{background:var(--orange)}
.btn{width:100%;margin-top:20px;border:0;border-radius:12px;padding:17px;font:800 18px var(--f);background:var(--orange);color:#fff;cursor:pointer}
.btn.gr{background:var(--soft);color:var(--navy)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:inherit;font:600 14px var(--f);opacity:.8;cursor:pointer;margin-top:16px;text-decoration:underline}
.dt{display:inline-block;background:var(--soft);padding:8px 14px;border-radius:30px;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--navy)}
.err{color:#C62828;font-weight:600;margin-top:12px;min-height:20px}
.done{text-align:center;background:var(--white);color:var(--navy);border-radius:18px;padding:40px 26px}
.done .tick{width:84px;height:84px;border-radius:50%;background:var(--ok);margin:0 auto 18px;display:grid;place-items:center}
.done .tick svg{width:46px;height:46px}.done p{font-size:19px;line-height:1.45;max-width:520px;margin:0 auto 10px}
.done.out .tick,.done .tick.or{background:var(--orange)}
.done .dt{margin-bottom:14px}
.warn{background:#FFF4E5;border:3px solid var(--orange);border-radius:14px;padding:18px;margin:14px auto 12px;max-width:560px}
.warn svg{display:block;margin:0 auto 6px}
.warn b{display:block;font-size:20px;color:#B34E00;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.warn p{margin:0 auto!important;font-weight:700}
.langs button{font-size:18px}.langs button:last-child{grid-column:1/-1}
/* Impresión del informe: solo la tabla, apaisada y con firmas */
#inf-sheet{display:none}
@media print{
 @page inf{size:A4 landscape;margin:10mm}
 body.inf-print:not(.rc-print){display:block;min-height:0;background:#fff;color:#000}
 body.inf-print:not(.rc-print)>*:not(#inf-sheet){display:none!important}
 body.inf-print:not(.rc-print) #inf-sheet{display:block;page:inf;font-family:var(--f);color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #inf-sheet h2{font-size:20px;font-weight:900;margin:0 0 3px}
 #inf-sheet .is-meta{font-size:12px;margin:0 0 10px}
 #inf-sheet table{width:100%;border-collapse:collapse;font-size:12px}
 #inf-sheet thead{display:table-header-group}
 #inf-sheet th{background:#EEF2F8;color:#000;text-align:left;padding:6px;border-bottom:2px solid #000;white-space:nowrap}
 #inf-sheet tr{break-inside:avoid;page-break-inside:avoid}
 #inf-sheet td{padding:5px 6px;border-bottom:1px solid #999;vertical-align:middle;white-space:normal}
 #inf-sheet td.nw{white-space:nowrap}
 #inf-sheet td img{display:block;max-width:34mm;max-height:15mm;width:auto;height:auto}
 #inf-sheet .is-foot{font-size:11px;margin-top:8px}
}
/* Firma */
.sg-box{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
#sg-cv{display:block;width:100%;height:clamp(190px,36vh,300px);touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.sg-box::after{content:"";position:absolute;left:5%;right:5%;bottom:22%;border-bottom:2px dashed var(--line);pointer-events:none}
.sg-x{position:absolute;inset-inline-start:5%;bottom:calc(22% + 6px);font:800 18px var(--f);color:#B8C3D6;pointer-events:none}
.sg-ph{position:absolute;inset:0;display:grid;place-items:center;font:600 24px var(--f);color:#C3CCDB;pointer-events:none;transition:opacity .15s}
.sg-box.has .sg-ph{opacity:0}
.sg-th{display:block;height:34px;max-width:120px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.sg-big{display:block;width:100%;border:2px solid var(--line);border-radius:10px;margin-top:12px;background:#fff}
/* Rueda 3D */
.wheel-wrap{--it:44px;--rows:5;--fs:22px;--fg:var(--navy);position:relative;height:calc(var(--it)*var(--rows));overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.wheel-wrap.lt{--fg:#fff;max-width:460px;margin:0 auto}
.wh-band{position:absolute;left:0;right:0;top:calc(var(--it)*(var(--rows) - 1)/2);height:var(--it);border-radius:14px;background:rgba(244,123,32,.16);border:2px solid var(--orange);box-shadow:0 0 0 4px rgba(244,123,32,.12)}
.wh-drum{position:absolute;inset:0;pointer-events:none;perspective-origin:50% 50%}
.wh-i{position:absolute;left:0;right:0;top:calc(var(--it)*(var(--rows) - 1)/2);height:var(--it);font:800 var(--fs) var(--f);line-height:var(--it);text-align:center;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px;backface-visibility:hidden;will-change:transform,opacity}
.wh-i.ph{font-weight:600;font-size:calc(var(--fs)*.78)}
.wh-scroll{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;cursor:grab;outline-offset:-3px;border-radius:14px}
.wh-scroll::-webkit-scrollbar{display:none}
.wh-r{height:var(--it);scroll-snap-align:center}
.wh-pad{height:calc(var(--it)*(var(--rows) - 1)/2)}
footer{padding:12px;text-align:center;font-size:12px;opacity:.6}
footer button{color:#fff}
/* staff */
#v-staff{max-width:1100px;color:var(--navy)}
.panel{background:var(--soft);border-radius:18px;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border-radius:14px;padding:16px;border-left:6px solid var(--navy)}.kpi.o{border-color:var(--orange)}.kpi.g{border-color:var(--ok)}
.kpi b{font-size:36px;font-weight:900;display:block}.kpi span{font-size:13px;font-weight:600;opacity:.7}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:6px 0 14px}.filters div{flex:1;min-width:130px}.filters label{margin:0 0 4px}
.filters button{padding:14px 16px;border:0;border-radius:10px;font:800 14px var(--f);background:var(--navy);color:#fff;cursor:pointer}
.tw{overflow-x:auto;background:#fff;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--navy);color:#fff;text-align:left;padding:11px;font-weight:600;white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800}.t-v{background:#FFE6D2;color:#B34E00}.t-w{background:#DCE6F8;color:var(--navy2)}
.in{color:var(--ok);font-weight:800}.h2{font-size:20px;font-weight:900;margin:18px 0 10px}
.abtn{border:0;border-radius:8px;padding:7px 12px;font:800 13px var(--f);cursor:pointer;background:var(--orange);color:#fff}
.abtn.nv{background:var(--navy)}
.ed{color:var(--orange);font-weight:800;cursor:help}
#qrbox{background:#fff;display:inline-block;padding:14px;border-radius:12px}
.pin{max-width:320px;margin:auto;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,31,68,.72);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mbox{background:#fff;color:var(--navy);border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.mbox h2{font-size:22px;font-weight:900}.mbox .hint{font-size:12px;opacity:.7;margin-top:4px}
.mrow{display:flex;gap:10px}.mrow .btn{margin-top:16px}
.rc-open{border:0;border-radius:12px;padding:13px 18px;font:900 16px var(--f);background:#D32F2F;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:9px;box-shadow:0 4px 14px rgba(211,47,47,.35)}
.rc-open svg{width:22px;height:22px}.rc-open b{background:#fff;color:#D32F2F;border-radius:20px;padding:1px 10px;font-size:15px}
.qr-row{display:flex;gap:20px;align-items:stretch;flex-wrap:wrap}.qr-row>div{flex:0 0 auto;max-width:100%}
.rc-big{flex:1;min-width:250px;min-height:230px;border:0;border-radius:20px;background:linear-gradient(135deg,#E53935,#B71C1C);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px;font-family:var(--f);text-align:center;animation:rcglow 1.6s ease-in-out infinite}
.rc-big:hover{transform:scale(1.015)}.rc-big svg{width:54px;height:54px}
.rc-bt{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.rc-bign{font-size:72px;font-weight:900;line-height:1}
.rc-bs{font-size:14px;font-weight:700;opacity:.9}
@keyframes rcglow{0%,100%{box-shadow:0 6px 18px rgba(211,47,47,.4)}50%{box-shadow:0 6px 34px rgba(211,47,47,.85)}}
@media(prefers-reduced-motion:reduce){.rc-big{animation:none}}
.rcbox{max-width:1000px}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rc-total{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;background:#FDECEC;border:3px solid #D32F2F;border-radius:14px;padding:12px 18px;margin-bottom:14px;box-shadow:0 10px 0 #fff}.rc-total.all{background:#E8F7EF;border-color:var(--ok)}.rc-total.all>b{color:var(--ok)}
.rc-bar{flex-basis:100%;height:10px;border-radius:6px;background:#F5C9C9;overflow:hidden}.rc-total.all .rc-bar{background:#BFE6D1}.rc-bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.rc-total>b{font-size:56px;font-weight:900;line-height:1;color:#D32F2F}.rc-total span{font-weight:800;font-size:18px}.rc-total small{font-weight:600;font-size:14px;opacity:.8}
.rc-cols{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:16px;align-items:start}
.rc-img{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden}.rc-img img{display:block;width:100%}
.rc-z{position:absolute;border:3px solid var(--c);border-radius:4px;opacity:.5}
.rc-z::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.28}
.rc-z.act{opacity:1}.rc-z.act::before{animation:rcp 1.1s ease-in-out infinite alternate}
@keyframes rcp{from{opacity:.15}to{opacity:.55}}
.rc-b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 22px/1 var(--f)}
.rc-b small{font-size:9px;font-weight:800;margin-top:1px}
.rc-card{background:#fff;border:2px solid var(--line);border-left:10px solid var(--c);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.rc-ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rc-chip{background:var(--c);border-radius:8px;padding:3px 12px;font-weight:900;font-size:16px}.rc-num{font-size:30px;font-weight:900}.rc-where{font-weight:700;font-size:14px;opacity:.85}
.rc-card ul{list-style:none;padding:0;margin:8px 0 0}
.rc-p{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-size:17px}
.rc-p b{flex:1}.rc-p>span:last-child{opacity:.75;white-space:nowrap;font-size:13px;text-align:right}
.rc-ck{flex:0 0 34px;height:34px;border:3px solid var(--navy);border-radius:9px;display:grid;place-items:center;font:900 22px var(--f);color:#fff;background:#fff}
.rc-p.ok{background:#E8F7EF}.rc-p.ok .rc-ck{background:var(--ok);border-color:var(--ok)}.rc-p.ok b{opacity:.7}
.rc-dh{margin:12px 0 0;font-weight:800;font-size:13px;color:var(--ok);text-transform:uppercase;letter-spacing:.5px}
.rc-of{font-size:14px;font-weight:600;opacity:.6}
.rc-z.done{opacity:1}.rc-z.done::before{opacity:.22}
.rc-z.out{opacity:1}.rc-z.out::before{display:none}
.rc-pillw{position:absolute;text-align:center;pointer-events:none}
.rc-pill{display:inline-block;border:2px solid #fff;border-radius:20px;padding:1px 9px;font:800 11px var(--f);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.rc-sub{margin-top:10px;padding-top:6px;border-top:2px dashed var(--line)}
.rc-sh2{font-size:14px;font-weight:600}.rc-sh2 b{font-weight:900;font-size:16px}.rc-sh2 span{opacity:.7}
.fx-as{width:auto;padding:8px 10px;font-size:14px;border-radius:8px}
.rc-sheet{display:none}
.rc-none{margin-top:6px;font-size:14px;opacity:.65}.rc-old{color:#C62828;font-style:normal;font-weight:800}
@media(max-width:700px){.rc-cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rc-z.act::before{animation:none}}
@media print{@page{size:A4;margin:12mm}body.rc-print .rc-screen{display:none!important}body.rc-print .rc-sheet{display:block}
.rc-sh h2{font-size:22px}.rc-sh p{font-size:12px;margin:2px 0 10px}
.rc-pc{break-inside:avoid;margin-bottom:12px}.rc-ph{font-size:14px;padding:5px 8px;background:#eee;border-left:8px solid var(--c)}
.rc-pt{width:100%;border-collapse:collapse;font-size:13px}.rc-pt th{background:#fff;color:#000;border-bottom:2px solid #000;padding:4px}.rc-pt td{border-bottom:1px solid #999;padding:6px 4px;height:36px;white-space:normal}
.pk{display:inline-block;width:24px;height:24px;border:2.5px solid #000;border-radius:4px;text-align:center;line-height:20px;font-weight:900}.pl{width:26%}
body.rc-print #v-staff .panel>*:not(#rc){display:none!important}body.rc-print #rc{display:block!important;position:static;background:#fff;padding:0}body.rc-print .rcbox{max-height:none;overflow:visible;max-width:none}.rcbox{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media print{body{background:#fff}header,footer,.filters,.noprint,.modal{display:none!important}#v-staff{color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">YUSEN <b>Logistics</b><small>BARCELONA</small></div>
  <div class="clock" id="clock"></div>
</header>
<main>
  <!-- Idioma -->
  <section class="view on" id="v-lang">
    <h1>Bienvenido · Benvingut · Welcome · Bienvenue · Bem-vindo · Bun venit · ようこそ · مرحباً · خوش آمدید</h1>
    <p class="sub">Idioma · Idioma · Language · Langue · Idioma · Limbă · 言語 · اللغة · زبان</p>
    <div class="wheel-wrap lt" id="wh-lang" aria-label="Idioma"></div>
    <div style="max-width:420px;margin:0 auto"><button class="btn" id="lang-go"></button></div>
  </section>
  <!-- Tipo -->
  <section class="view" id="v-type">
    <h1 data-t="pick"></h1><p class="sub" data-t="pickSub"></p>
    <div class="grid">
      <button class="big or" data-type="visita">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span data-t="visits"></span><small data-t="visitsSub"></small></button>
      <button class="big" data-type="trabajador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15a8 8 0 0 1 16 0z"/><path d="M2 18h20M12 5v3"/></svg>
        <span data-t="workers"></span><small data-t="workersSub"></small></button>
    </div>
    <button class="link" id="b-lang" data-t="changeLang"></button>
  </section>
  <!-- Formulario -->
  <section class="view" id="v-form">
    <div class="card">
      <span class="dt" id="dt"></span>
      <h1 id="f-title" style="font-size:30px"></h1>
      <div class="seg"><button id="m-in" class="on" data-t="entry"></button><button id="m-out" class="out" data-t="exit"></button></div>
      <!-- Trabajadores: primero empresa (desplegable) -->
      <div id="w-co-wrap">
        <label for="f-cosel" data-t="company"></label>
        <select id="f-cosel"><option value="" disabled selected data-t="coSel"></option><option>NWT</option><option>ETT</option><option>CTC</option><option>OTROS</option></select>
        <input id="f-coo" data-p="coOther" autocomplete="off" style="margin-top:10px;display:none">
      </div>
      <label for="f-name" data-t="name"></label>
      <select id="f-nsel" style="display:none"></select>
      <div class="wheel-wrap" id="wh-name" style="display:none" aria-label="Nombre"></div>
      <input id="f-name" autocomplete="off">
      <!-- Visitas: empresa en texto libre -->
      <div id="v-co-wrap"><label for="f-co" data-t="company"></label><input id="f-co" autocomplete="off"></div>
      <div id="reason-wrap"><label for="f-re" data-t="reason"></label><input id="f-re" autocomplete="off"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go"></button>
      <button class="link" id="b-back" style="color:var(--navy)" data-t="back"></button>
    </div>
  </section>
  <!-- Firma -->
  <section class="view" id="v-sign">
    <div class="card">
      <h1 data-t="sgT" style="font-size:30px"></h1>
      <p class="sub" data-t="sgH" style="margin-bottom:14px"></p>
      <div class="sg-box"><canvas id="sg-cv"></canvas><span class="sg-x" aria-hidden="true">✕</span><span class="sg-ph" data-t="sgHere"></span></div>
      <p class="hint" data-t="sgNote" style="font-size:13px;opacity:.7;margin-top:8px"></p>
      <div class="err" id="sg-err" role="alert"></div>
      <div class="mrow"><button class="btn gr" id="sg-clear" data-t="sgClear" style="flex:1"></button><button class="btn" id="sg-ok" data-t="sgOk" style="flex:2"></button></div>
      <button class="link" id="sg-back" style="color:var(--navy)" data-t="back"></button>
    </div>
  </section>
  <!-- Salida registrada -->
  <section class="view" id="v-done">
    <div class="done out"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      <h1 data-t="dO" style="font-size:32px"></h1><p id="done-msg" style="font-size:24px;font-weight:800"></p>
      <button class="btn newb" data-t="newReg" style="max-width:320px"></button></div>
  </section>

/* ---- Rueda 3D (tipo selector de iOS) ---- */
function makeWheel(host,cb,o={}){
 const ITEM=o.item||44,ROWS=o.rows||5,LOOP=!!o.loop,K=9,HALF=(ROWS-1)/2;
 const STEP=22*Math.PI/180,RAD=ITEM/STEP;
 host.style.setProperty("--it",ITEM+"px");host.style.setProperty("--rows",ROWS);host.style.setProperty("--fs",(o.fs||22)+"px");
 host.innerHTML='<div class="wh-band"></div><div class="wh-drum"></div><div class="wh-scroll" tabindex="0" role="listbox"></div>';
 const sc=host.querySelector(".wh-scroll"),dr=host.querySelector(".wh-drum");
 dr.style.perspective=(ITEM*10)+"px";
 let items=[],n=0,els=[],idx=0,curLv=0,tm,drag=null,moved=false,tickAt=-1;
 const total=()=>LOOP?n*K:n,clamp=i=>Math.max(0,Math.min(total()-1,i)),lv=i=>LOOP?i%n:i;
 function paint(){
  const f=sc.scrollTop/ITEM,c=Math.round(f);
  if(c!==tickAt){if(tickAt>=0){try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}}tickAt=c}
  els.forEach((e,i)=>{
   const d=i-f,ad=Math.abs(d);
   if(ad>HALF+.8){e.style.visibility="hidden";return}
   e.style.visibility="visible";
   e.style.opacity=Math.max(0,1-ad/(HALF+.6)*.9);
   e.style.transform="translateZ("+(-RAD)+"px) rotateX("+(-d*STEP)+"rad) translateZ("+RAD+"px) scale("+(1+Math.max(0,1-ad)*.06)+")";
  });
 }
 const go=(i,smooth)=>sc.scrollTo({top:clamp(i)*ITEM,behavior:smooth?"smooth":"auto"});
 function settle(){
  if(drag)return;
  let i=clamp(Math.round(sc.scrollTop/ITEM));
  if(Math.abs(sc.scrollTop-i*ITEM)>1){go(i,true);return}
  /* rueda circular: al parar, vuelve a la copia central sin que se note */
  if(LOOP&&(i<2*n||i>=(K-2)*n)){
   i=Math.floor(K/2)*n+i%n;
   sc.style.scrollSnapType="none";sc.scrollTop=i*ITEM;sc.style.scrollSnapType="";tickAt=i;paint();
  }
  idx=i;
  if(lv(i)!==curLv){curLv=lv(i);cb&&cb(items[curLv],curLv)}
 }
 const later=ms=>{clearTimeout(tm);tm=setTimeout(settle,ms)};
 sc.addEventListener("scroll",()=>{paint();later(120)},{passive:true});
 /* ratón: arrastrar */
 sc.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||e.button!==0)return;
  drag={y:e.clientY,st:sc.scrollTop};moved=false;
  sc.style.scrollSnapType="none";sc.style.cursor="grabbing";sc.setPointerCapture(e.pointerId);
 });
 sc.addEventListener("pointermove",e=>{
  if(!drag)return;const dy=e.clientY-drag.y;
  if(Math.abs(dy)>4)moved=true;
  sc.scrollTop=drag.st-dy;
 });
 const end=()=>{
  if(!drag)return;drag=null;sc.style.scrollSnapType="";sc.style.cursor="";
  if(moved)go(Math.round(sc.scrollTop/ITEM),true);
  later(220);
 };
 sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",end);
 /* toque / clic: lleva esa fila al centro; si ya estaba en el centro, confirma */

/* ====== FIRMA: pad táctil ====== */
const pad=(()=>{
 const cv=$("#sg-cv"),box=cv.parentNode,ctx=cv.getContext("2d"),INK="#0A1F44",LW=3.4;
 let strokes=[],cur=null,pid=null,W=0,H=0;
 const dpr=()=>Math.min(window.devicePixelRatio||1,3);
 function render(c,w,h,lw){
  c.lineCap=c.lineJoin="round";c.strokeStyle=c.fillStyle=INK;c.lineWidth=lw;
  strokes.forEach(s=>{
   const p=s.map(q=>[q[0]*w,q[1]*h]);
   c.beginPath();
   if(p.length===1){c.arc(p[0][0],p[0][1],lw/2,0,7);c.fill();return}
   c.moveTo(p[0][0],p[0][1]);
   for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);
   c.lineTo(p[p.length-1][0],p[p.length-1][1]);c.stroke();
  });
 }
 function redraw(){
  if(!W)return;
  const d=dpr();ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);render(ctx,W,H,LW);
  box.classList.toggle("has",strokes.length>0);
 }
 function size(){
  const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
  const d=dpr();W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);redraw();
 }
 new ResizeObserver(size).observe(cv);
 const pt=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
 cv.addEventListener("pointerdown",e=>{
  if(pid!==null||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(x){}
  cur=[pt(e)];strokes.push(cur);redraw();
 });
 cv.addEventListener("pointermove",e=>{
  if(e.pointerId!==pid||!cur)return;e.preventDefault();
  const p=pt(e),l=cur[cur.length-1];
  if(Math.abs(p[0]-l[0])*W+Math.abs(p[1]-l[1])*H<1.5)return;
  cur.push(p);redraw();
 });
 const up=e=>{if(e.pointerId===pid){pid=null;cur=null}};
 ["pointerup","pointercancel","lostpointercapture"].forEach(n=>cv.addEventListener(n,up));
 cv.addEventListener("contextmenu",e=>e.preventDefault());
 return{
  clear(){strokes=[];cur=null;pid=null;box.classList.remove("has");redraw()},
  hasInk(){let n=0;strokes.forEach(s=>{for(let i=1;i<s.length;i++)n+=Math.hypot((s[i][0]-s[i-1][0])*W,(s[i][1]-s[i-1][1])*H)});return n>=40},
  png(){
   const EW=600,EH=Math.round(EW*H/W),c=document.createElement("canvas");c.width=EW;c.height=EH;
   const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,EW,EH);render(x,EW,EH,LW*EW/W);
   return c.toDataURL("image/png");
  }
 };
})();
/* Muestra el pad; al confirmar guarda con save(firma). Devuelve true si se guardó, false si la persona vuelve atrás */
function signAndSave(save){
 return new Promise(resolve=>{
  const ok=$("#sg-ok"),clr=$("#sg-clear"),bk=$("#sg-back"),err=$("#sg-err");
  const lock=v=>{ok.disabled=clr.disabled=bk.disabled=v};
  pad.clear();err.textContent="";lock(false);show("v-sign");
  clr.onclick=()=>{pad.clear();err.textContent=""};
  bk.onclick=()=>{show("v-form");resolve(false)};
  ok.onclick=async()=>{
   prime();
   if(!pad.hasInk()){err.textContent=t("sgEmpty");return}
   lock(true);err.textContent="";
   try{await save(pad.png());resolve(true)}
   catch(e){console.error(e);err.textContent=t("fail");lock(false)}
  };
 });
}

   return `<div class="rc-card" style="--c:${z.color}"><div class="rc-ch"><span class="rc-chip" style="color:${z.txt}">${z.k}</span><b class="rc-num">${pend(a).length}</b><span class="rc-of">por localizar de ${a.length}</span><span class="rc-where">· ${multi?z.zona+" (según su área)":"Buscar en: "+z.zona}</span></div>${inner}</div>`;
  };
  const extra=(title,a)=>{if(!a.length)return"";return `<div class="rc-card" style="--c:#8A94A6"><div class="rc-ch"><span class="rc-chip" style="color:#fff">${title}</span><b class="rc-num">${pend(a).length}</b><span class="rc-of">por localizar de ${a.length}</span><span class="rc-where">· Sin zona asignada en el plano</span></div>${list(a)}</div>`};
  /* hoja para imprimir: cuadros vacíos para marcar con bolígrafo */
  const prow=r=>`<tr><td><span class="pk">${r.localizado?"✓":""}</span></td><td><b>${esc(r.nombre)}</b></td><td>${sub(r)}${hm(r.entrada)}${r.fecha!==today?" ("+esc(dd(r.entrada))+")":""}</td><td class="pl"></td></tr>`;
  const ptab=(title,where,color,a)=>`<div class="rc-pc" style="--c:${color}"><div class="rc-ph"><b>${esc(title)}</b> · ${a.length} · ${esc(where)}</div><table class="rc-pt"><thead><tr><th style="width:36px"></th><th>Nombre</th><th>Entrada</th><th>Hora localizado</th></tr></thead><tbody>${a.length?a.map(prow).join(""):'<tr><td colspan="4">Nadie registrado.</td></tr>'}</tbody></table></div>`;
  const sheetTabs=ZONAS.map(z=>blocksOf(z).filter(b=>!b.un||b.list.length).map(b=>ptab(b.title,"Buscar en: "+b.where,z.color,b.list)).join("")).join("");
  const mb=box.closest(".mbox"),st=mb?mb.scrollTop:0;
  box.innerHTML=`<div class="rc-screen">
  <div class="rc-total${miss||!total?"":" all"}"><b>${total&&!miss?"✓":miss}</b><span>${total&&!miss?"¡Todos localizados!":(miss===1?"persona por localizar":"personas por localizar")}<br><small>${found} de ${total} localizados · ${total-nv} trabajadores · ${nv} ${nv===1?"visita":"visitas"}</small></span><div class="rc-bar"><i style="width:${total?found/total*100:0}%"></i></div></div>
  <div class="rc-cols"><div><div class="rc-img"><img src="${LAYOUT}" alt="Plano del almacén">${ZONAS.map(z=>zoneMap(z,false)).join("")}</div></div>
  <div>${ZONAS.map(card).join("")}${extra("OTROS",g.OTROS)}${extra("VISITAS",g.VISITAS)}</div></div>
  <p class="hint" style="margin-top:8px">Toca a cada persona cuando la encuentres: pasa a «Localizados» y se ve en todos los móviles a la vez. Se basa en las entradas sin salida registrada: quien salió sin fichar sigue contando y quien entró sin registrarse no aparece. ⚠ marca entradas de días anteriores: verifícalas.</p></div>
  <div class="rc-sheet"><div class="rc-sh"><h2>Hoja de recuento · Yusen Logistics Barcelona</h2><p>Impreso el ${new Date().toLocaleString("es-ES")} · ${total} personas registradas dentro (${found} ya localizadas)</p></div>
  <div class="rc-cols"><div><div class="rc-img"><img src="${LAYOUT}" alt="Plano del almacén">${ZONAS.map(z=>zoneMap(z,true)).join("")}</div></div>
  <div>${sheetTabs}${g.OTROS.length?ptab("OTROS","Sin zona asignada","#8A94A6",g.OTROS):""}${g.VISITAS.length?ptab("VISITAS","Sin zona asignada","#8A94A6",g.VISITAS):""}</div></div></div>`;
  if(mb)mb.scrollTop=st;
 }
 /* ---- Pestañas ---- */
 const tabs=a=>{$("#pane-a").style.display=a?"block":"none";$("#pane-f").style.display=a?"none":"block";$("#tab-a").classList.toggle("on",a);$("#tab-f").classList.toggle("on",!a)};
 $("#tab-a").onclick=()=>tabs(true);$("#tab-f").onclick=()=>tabs(false);
 /* ---- Trabajadores fijos ---- */
 const fxAreaOpts=(c,sel)=>'<option value="">Sin asignar</option>'+areasOf(c).map(x=>`<option value="${esc(x.k)}"${x.k===sel?" selected":""}>${esc(x.k)}</option>`).join("");
 function fxForm(){const c=$("#fx-co").value,has=areasOf(c).length>0;$("#fx-aw").style.display=has?"block":"none";$("#fx-ar").innerHTML=fxAreaOpts(c,"")}
 $("#fx-co").onchange=fxForm;fxForm();
 function drawFijos(){
  const box=$("#fx-list");if(!box)return;
  box.innerHTML=EMPRESAS_FIJAS.map(c=>{
   const a=fijosRaw.filter(r=>r.empresa===c).sort((x,y)=>x.nombre.localeCompare(y.nombre,"es")),has=areasOf(c).length>0;
   return `<div class="h2">${c} <span style="font-weight:600;font-size:14px;opacity:.6">(${a.length})</span></div><div class="tw"><table><tbody>`+
    (a.map(r=>`<tr><td style="width:100%">${esc(r.nombre)}</td>${has?`<td><select class="fx-as" data-farea="${esc(r.id)}" aria-label="Área de ${esc(r.nombre)}">${fxAreaOpts(c,r.area||"")}</select></td>`:""}<td><button class="abtn nv" data-fdel="${esc(r.id)}">Eliminar</button></td></tr>`).join("")||'<tr><td>Sin trabajadores guardados.</td></tr>')+`</tbody></table></div>`;
  }).join("");
 }
 $("#fx-list").onchange=async e=>{
  const sel=e.target.closest("[data-farea]");if(!sel)return;
  try{await updateDoc(doc(db,"trabajadores_fijos",sel.dataset.farea),{area:sel.value})}
  catch(x){console.error(x);$("#fx-err").textContent="No se pudo cambiar el área. Inténtalo de nuevo."}
 };
 onFijos=()=>{drawFijos();drawRC()};drawFijos();
 $("#fx-list").onclick=async e=>{
  const b=e.target.closest("[data-fdel]");if(!b)return;
  const r=fijosRaw.find(x=>x.id===b.dataset.fdel);if(!r||!confirm("¿Eliminar a "+r.nombre+" de "+r.empresa+"?"))return;
  try{await deleteDoc(doc(db,"trabajadores_fijos",r.id))}catch(x){console.error(x);$("#fx-err").textContent="No se pudo eliminar. Inténtalo de nuevo."}
 };
 const addFijo=async()=>{
  const c=$("#fx-co").value,n=$("#fx-n").value.trim().replace(/\s+/g," "),err=$("#fx-err");err.textContent="";
  if(!n){err.textContent="Escribe el nombre del trabajador.";return}
  if(fijosRaw.some(r=>r.empresa===c&&norm(r.nombre)===norm(n))){err.textContent="Ese trabajador ya está guardado en "+c+".";return}
  const btn=$("#fx-add");btn.disabled=true;
  try{await addDoc(colF,{empresa:c,nombre:n,area:areasOf(c).length?$("#fx-ar").value:""});$("#fx-n").value="";$("#fx-n").focus()}
  catch(x){console.error(x);err.textContent="No se pudo guardar. Revisa los permisos de Firebase (colección trabajadores_fijos)."}
  btn.disabled=false;
 };
 $("#fx-add").onclick=addFijo;
 $("#fx-n").onkeydown=e=>{if(e.key==="Enter")addFijo()};
 const url=location.href.split("#")[0].split("?")[0];$("#qrurl").textContent=url;new QRCode($("#qrbox"),{text:url,width:200,height:200,colorDark:"#0A1F44"});
 let inside=[],rows=[],unRep=null,editId=null;
 const find=id=>inside.find(r=>r.id===id)||rows.find(r=>r.id===id);
 const hm=ts=>ts?ts.toDate().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—";
 const dd=ts=>ts?ts.toDate().toLocaleDateString("es-ES"):"";
 const okSig=s=>typeof s==="string"&&/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(s);
 const sig=r=>okSig(r.firma)?'<img class="sg-th" src="'+r.firma+'" alt="Firma" data-sig="'+esc(r.id)+'">':"—";
 const tag=x=>x==="visita"?'<span class="tag t-v">Visita</span>':'<span class="tag t-w">Trabajador</span>';
 const dur=r=>{if(!r.salida)return"";const m=Math.round((r.salida.toMillis()-r.entrada.toMillis())/60000);return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"};
 function drawIn(){
  const a=[...inside].sort((x,y)=>x.entrada.toMillis()-y.entrada.toMillis());
  $("#k1").textContent=a.length;$("#rc-n").textContent=a.length;drawRC();$("#k2").textContent=a.filter(r=>r.tipo==="visita").length;$("#k3").textContent=a.filter(r=>r.tipo==="trabajador").length;
  $("#tb-in").innerHTML=a.map(r=>`<tr><td>${tag(r.tipo)}</td><td>${esc(r.nombre)}</td><td>${esc(r.empresa)}</td><td>${esc(r.motivo)}</td><td>${dd(r.entrada)} ${hm(r.entrada)}</td><td>${sig(r)}</td><td class="noprint"><button class="abtn" data-out="${esc(r.id)}">Marcar salida</button></td></tr>`).join("")||'<tr><td colspan="7">Nadie dentro ahora.</td></tr>';
 }
 function drawRep(){
  const ft=$("#ft").value,fs=$("#fs").value;
  const a=rows.filter(r=>(!ft||r.tipo===ft)&&(!fs||(fs==="in")===r.abierto)).sort((x,y)=>y.entrada.toMillis()-x.entrada.toMillis());
  $("#k4").textContent=a.filter(r=>!r.abierto).length;
  $("#tb-rep").innerHTML=a.map(r=>`<tr><td>${esc(r.fecha)}</td><td>${tag(r.tipo)}</td><td>${esc(r.nombre)}</td><td>${esc(r.empresa)}</td><td>${esc(r.motivo)}</td><td>${hm(r.entrada)}</td><td>${r.abierto?'<span class="in">Dentro</span>':hm(r.salida)}${r.editado?' <span class="ed" title="Editado manualmente">✎</span>':''}</td><td>${dur(r)}</td><td>${sig(r)}</td><td class="noprint"><button class="abtn nv" data-edit="${esc(r.id)}">Editar</button></td></tr>`).join("")||'<tr><td colspan="10">Sin registros para este filtro.</td></tr>';
  drawRep.cur=a;
 }
 function sub(){
  unRep?.();const f1=$("#f1").value,f2=$("#f2").value;
  unRep=onSnapshot(query(col,where("fecha",">=",f1),where("fecha","<=",f2)),s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));drawRep()});
 }
 unsubs.push(onSnapshot(query(col,where("abierto","==",true)),s=>{inside=s.docs.map(d=>({id:d.id,...d.data()}));drawIn()}),()=>unRep?.());
 sub();
 ["f1","f2"].forEach(i=>$("#"+i).onchange=sub);["ft","fs"].forEach(i=>$("#"+i).onchange=drawRep);
 async function printInforme(){
  const a=drawRep.cur||[],f1=$("#f1").value,f2=$("#f2").value,fd=s=>s.split("-").reverse().join("/"),opt=id=>$("#"+id).selectedOptions[0].textContent;
  const meta=[f1===f2?"Fecha: "+fd(f1):"Del "+fd(f1)+" al "+fd(f2)];
  if($("#ft").value)meta.push("Tipo: "+opt("ft"));
  if($("#fs").value)meta.push("Estado: "+opt("fs"));
  meta.push(a.length+(a.length===1?" registro":" registros"),"Impreso el "+new Date().toLocaleString("es-ES"));
  const T={visita:"Visita",trabajador:"Trabajador"};
  const body=a.map(r=>`<tr><td class="nw">${esc(dd(r.entrada))}</td><td>${esc(T[r.tipo]||r.tipo)}</td><td><b>${esc(r.nombre)}</b></td><td>${esc(r.empresa)}</td><td>${esc(r.motivo)}</td><td class="nw">${hm(r.entrada)}</td><td class="nw">${r.abierto?"Dentro":hm(r.salida)}${r.editado?" ✎":""}</td><td class="nw">${dur(r)}</td><td>${okSig(r.firma)?'<img src="'+r.firma+'" alt="Firma">':"—"}</td></tr>`).join("")||'<tr><td colspan="9">Sin registros para este filtro.</td></tr>';
  $("#inf-sheet")?.remove();
  const s=document.createElement("div");s.id="inf-sheet";
  s.innerHTML=`<h2>Registro de accesos · Yusen Logistics Barcelona</h2><p class="is-meta">${meta.map(esc).join(" · ")}</p><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Nombre</th><th>Empresa</th><th>Motivo</th><th>Entrada</th><th>Salida</th><th>Duración</th><th>Firma</th></tr></thead><tbody>${body}</tbody></table>${a.some(r=>r.editado)?'<p class="is-foot">✎ Hora editada manualmente.</p>':""}`;
  document.body.appendChild(s);
  document.body.classList.remove("rc-print");document.body.classList.add("inf-print");
  window.onafterprint=()=>{window.onafterprint=null;s.remove();document.body.classList.remove("inf-print")};
  await Promise.all([...s.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):0));
  print();
 }
 $("#prt").onclick=printInforme;

 /* ---- Editar / marcar salida manual ---- */
 function openEdit(id,quick){
  const r=find(id);if(!r)return;editId=id;
  $("#md-t").textContent=quick?"Marcar salida manual":"Editar registro";
  $("#md-h").textContent=quick?"Indica la hora real de salida de esta persona.":"Corrige los datos o la hora de entrada y salida.";
  $("#e-n").value=r.nombre||"";$("#e-c").value=r.empresa||"";$("#e-r").value=r.motivo||"";
  $("#e-rw").style.display=r.tipo==="visita"?"block":"none";
  $("#e-i").value=toLocal(r.entrada.toDate());
  $("#e-o").value=r.salida?toLocal(r.salida.toDate()):(quick?toLocal(new Date()):"");
  $("#e-err").textContent="";$("#md").hidden=false;
  (quick?$("#e-o"):$("#e-n")).focus();
 }
 const closeEdit=()=>{$("#md").hidden=true;editId=null};
 const showSig=id=>{const r=find(id);if(!r||!okSig(r.firma))return;$("#sgv-t").textContent=r.nombre;$("#sgv-h").textContent=r.empresa+" · "+dd(r.entrada)+" "+hm(r.entrada);$("#sgv-i").src=r.firma;$("#sgv").hidden=false};
 const closeSig=()=>{$("#sgv").hidden=true};
 $("#sgv-x").onclick=closeSig;$("#sgv").onclick=e=>{if(e.target.id==="sgv")closeSig()};
 $("#tb-in").onclick=e=>{const s=e.target.closest("[data-sig]");if(s)return showSig(s.dataset.sig);const b=e.target.closest("[data-out]");if(b)openEdit(b.dataset.out,true)};
 $("#tb-rep").onclick=e=>{const s=e.target.closest("[data-sig]");if(s)return showSig(s.dataset.sig);const b=e.target.closest("[data-edit]");if(b)openEdit(b.dataset.edit,false)};
 $("#e-cancel").onclick=closeEdit;
 $("#md").onclick=e=>{if(e.target.id==="md")closeEdit()};
 $("#e-save").onclick=async()=>{
  const r=find(editId),err=$("#e-err");if(!r)return closeEdit();
  const n=$("#e-n").value.trim(),c=$("#e-c").value.trim(),mo=$("#e-r").value.trim();
  const ei=$("#e-i").value?new Date($("#e-i").value):null,eo=$("#e-o").value?new Date($("#e-o").value):null;
  if(!n||!c){err.textContent="Nombre y empresa son obligatorios.";return}
  if(!ei||isNaN(ei)){err.textContent="La hora de entrada no es válida.";return}
  if(eo&&(isNaN(eo)||eo<ei)){err.textContent="La salida no puede ser anterior a la entrada.";return}
  if(eo&&eo.getTime()>Date.now()+60000){err.textContent="La salida no puede ser futura.";return}
  const btn=$("#e-save");btn.disabled=true;
  try{
   await updateDoc(doc(db,COLECCION,editId),{nombre:n,empresa:c,motivo:r.tipo==="visita"?mo:"",key:makeKey(r.tipo,n,c),fecha:ymd(ei),entrada:Timestamp.fromDate(ei),salida:eo?Timestamp.fromDate(eo):null,abierto:!eo,editado:true});
   closeEdit();
  }catch(x){console.error(x);err.textContent="No se pudo guardar. Inténtalo de nuevo."}
  btn.disabled=false;
 };

 $("#csv").onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[["Fecha","Tipo","Nombre","Empresa","Motivo","Entrada","Salida","Duración","Firma"].map(q).join(";")];
  (drawRep.cur||[]).forEach(r=>lines.push([r.fecha,r.tipo,r.nombre,r.empresa,r.motivo,hm(r.entrada),r.abierto?"Dentro":hm(r.salida),dur(r),r.firma?"Sí":"No"].map(q).join(";")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}));a.download="registro_yusen_"+$("#f1").value+"_"+$("#f2").value+".csv";a.click();
 };
}
applyLang();
